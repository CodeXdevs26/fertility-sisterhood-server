services:
  server:
    build: .
    image: fertility-sisterhood-server:latest
    container_name: fertility-sisterhood-server
    restart: unless-stopped
    # tini as PID 1: forwards SIGTERM so `docker compose down` stops node cleanly
    init: true
    env_file: .env
    # NODE_ENV comes from .env (set it to "production" on the server)
    environment:
      PORT: ${PORT:-5004}
      # inside Docker every request arrives from the bridge gateway (172.x),
      # so trust private-network proxies (nginx on the host / in compose) to
      # pass the real client IP via X-Forwarded-For
      TRUST_PROXY: ${TRUST_PROXY:-loopback, uniquelocal}
    # leaves room for the 8s shutdown timeout in src/server.ts
    stop_grace_period: 10s
    ports:
      - "${PORT:-5004}:${PORT:-5004}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
